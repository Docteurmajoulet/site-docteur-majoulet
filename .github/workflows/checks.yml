# Contrôles automatiques du site docteurmajoulet.com — lancés à chaque push sur main (et sur les PR).
# Le déploiement Netlify n'attend pas ces contrôles : ils signalent (mail GitHub + coche rouge) mais ne bloquent pas.
# Détail des contrôles : _tests/README.md
name: Contrôles du site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statique:
    name: Contrôles statiques (HTML, liens, CSP, sitemap, règles éditoriales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 _tests/check_static.py
      - name: Dates de relecture et serveur d’aperçu
        run: python3 -m unittest discover -s _tests -p 'test_*.py'

  navigateur:
    name: Navigateur (axe, CSP, débordements) + Lighthouse
    runs-on: ubuntu-latest
    needs: statique
    timeout-minutes: 25
    defaults:
      run:
        working-directory: _tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Démarrage du serveur local
        run: npm run test:server
      - name: Navigation (clavier, souris, tiroir et changement de format)
        run: node navigation.mjs
      - name: Tests navigateur (48 pages × 4 largeurs)
        run: node browser.mjs
      - name: Lighthouse mobile (4 pages clés)
        if: always()
        run: node lighthouse.mjs
      - name: Rapports Lighthouse
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports-lighthouse
          path: _tests/reports/
          retention-days: 30

  compatibilite:
    name: Firefox et WebKit (parcours de rendez-vous)
    runs-on: ubuntu-24.04
    needs: statique
    timeout-minutes: 10
    defaults:
      run:
        working-directory: _tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - name: Parcours essentiels sous la CSP du site
        run: npm run test:compatibility
      - name: Résultats de compatibilité
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports-compatibilite
          path: _tests/reports/compatibility.json
          retention-days: 30

  html:
    name: Validation HTML W3C (Nu Html Checker, toutes les pages)
    runs-on: ubuntu-latest
    needs: statique
    timeout-minutes: 10
    defaults:
      run:
        working-directory: _tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _tests/package-lock.json
      - run: npm ci
      - name: Validation W3C (TECH19AT-2026-09-15 — Java fourni par l'exécuteur)
        run: node html_validate.mjs
